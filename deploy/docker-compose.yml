# LiveDeck on one host: the studio behind Caddy, and the LiveDeck server.
# Audio and video go through JaaS (Jitsi as a Service), so no media ports are
# needed here. See deploy/README.md.
#
#   cp deploy/.env.example deploy/.env    # then fill it in
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build

name: livedeck

services:
  # Studio + TLS + proxy for /signal. The only service with public ports.
  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
    environment:
      LIVEDECK_DOMAIN: ${LIVEDECK_DOMAIN:?set LIVEDECK_DOMAIN}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  # Rooms, roles, director control, and the signer of Jitsi media grants.
  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    environment:
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-https://${LIVEDECK_DOMAIN}}
      ROOM_KEY_SECRET: ${ROOM_KEY_SECRET:?set ROOM_KEY_SECRET (32+ random characters)}
      TRUST_PROXY: "true"
      JAAS_APP_ID: ${JAAS_APP_ID:?set JAAS_APP_ID from the JaaS console}
      JAAS_API_KEY_ID: ${JAAS_API_KEY_ID:?set JAAS_API_KEY_ID ("<app id>/<key id>")}
      JAAS_PRIVATE_KEY: ${JAAS_PRIVATE_KEY:?set JAAS_PRIVATE_KEY (the key PEM, newlines as \n)}
    expose:
      - "3001"
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:

# Render blueprint for the LiveDeck media server.
#
# READ THIS BEFORE DEPLOYING HERE
# -------------------------------
# The server is now an SFU: every participant's audio and video terminates in
# this process, over UDP (with a TCP fallback) on the mediasoup media ports.
# Render web services publish exactly one HTTP port and do not expose UDP, so
# on Render the media path is limited to TCP via a TURN relay in front of the
# SFU, which is a worse experience than direct UDP. A host that publishes UDP
# ports — Fly.io, Railway with TCP/UDP proxies, Hetzner/DigitalOcean/any VPS,
# or Kubernetes with a hostPort/NodePort — is the right home for this service.
#
# This blueprint is kept so the HTTP/WebSocket half still deploys here for
# evaluation. For real broadcasts, run the container where UDP is reachable.
#
# The studio itself is static and is not described here.

services:
  - type: web
    name: livedeck-server
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    # The repository root: `server/src` imports `../../shared/*`.
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /healthz
    # Rooms and routers live in one process's memory. Scaling out needs a
    # room-to-instance mapping first.
    numInstances: 1

    envVars:
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ROOM_KEY_SECRET
        generateValue: true
      - key: MEDIASOUP_ANNOUNCED_ADDRESS
        sync: false
      - key: MEDIASOUP_WORKERS
        value: "1"
      - key: TRUST_PROXY
        value: "true"
      # TURN: set one of the two options from server/.env.example.
      - key: CLOUDFLARE_TURN_KEY_ID
        sync: false
      - key: CLOUDFLARE_TURN_API_TOKEN
        sync: false

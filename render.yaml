# Render blueprint for the signaling relay.
#
# Commit this and point Render at the repository (New → Blueprint), or set the
# same values by hand on a Docker web service. Either way the two fields that
# are easy to get wrong are `dockerfilePath` and `dockerContext`: the relay
# compiles `shared/` from the repository root, so the build context has to be
# the root rather than `server/`.
#
# The studio itself is static and is not described here — it deploys to any
# static host. Only the relay needs a persistent process.

services:
  - type: web
    name: livedeck-signaling
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    # The repository root. See the note above and the header of the Dockerfile.
    dockerContext: .
    plan: starter
    region: oregon

    # The relay's own endpoint, ahead of Next, so a pass means the relay is up
    # rather than merely that something is answering the port.
    healthCheckPath: /healthz

    # A WebSocket relay keeps room state in one process's memory. More than one
    # instance would split rooms across them — two guests given the same room
    # name could land on different instances and never find each other — so
    # scaling out needs shared state (Redis) and sticky sessions first. See
    # README › It will not run on Vercel's serverless runtime.
    numInstances: 1

    envVars:
      # Which browser origins may open a socket. UNSET MEANS ANY ORIGIN, which
      # is fine on a laptop and wrong on the public internet: an open relay
      # lets anyone use your bandwidth to bootstrap their own calls. Set this
      # to wherever the studio is served from.
      - key: ALLOWED_ORIGINS
        sync: false

      # PORT is injected by Render and must not be pinned here.
      # HOST defaults to 0.0.0.0 in the image, which is what Render's router
      # needs — do not set it to localhost.

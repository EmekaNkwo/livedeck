# Render blueprint for the LiveDeck server.
#
# The server runs rooms, roles and director control over one WebSocket, and
# signs JaaS tokens; audio and video travel through JaaS (Jitsi as a Service).
# It needs only its HTTP port, which is all a Render web service offers, so it
# runs here unchanged. Set the three JAAS_* values from the JaaS console
# (server/.env.example explains each), and ALLOWED_ORIGINS to the studio's
# origin. Rooms live in one process's memory: keep a single instance.
#
# The studio itself is static and is not described here.

services:
  - type: web
    name: livedeck-server
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    # The repository root: `server/src` imports `../../shared/*`.
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /healthz
    # Rooms and routers live in one process's memory. Scaling out needs a
    # room-to-instance mapping first.
    numInstances: 1

    envVars:
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ROOM_KEY_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "true"
      - key: JAAS_APP_ID
        sync: false
      - key: JAAS_API_KEY_ID
        sync: false
      # The private key PEM, with newlines written as \n.
      - key: JAAS_PRIVATE_KEY
        sync: false

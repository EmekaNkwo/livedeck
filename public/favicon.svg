<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="LiveDeck Studio">
  <rect width="32" height="32" rx="7" fill="#0a0c11" />
  <!-- Program frame -->
  <rect x="5" y="8" width="22" height="15" rx="2.5" fill="none" stroke="#1cb8c6" stroke-width="2" />
  <!-- Picture-in-picture inset, mirroring the studio's signature layout -->
  <rect x="18" y="16" width="7" height="5" rx="1" fill="#1cb8c6" opacity="0.85" />
  <!-- On-air tally -->
  <circle cx="9.5" cy="12" r="2" fill="#f4542c" />
</svg>
